services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress
    volumes:
      - db_data:/var/lib/mysql

  wordpress:
    image: wordpress:latest
    depends_on:
      - db
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DEBUG: "1"
      WORDPRESS_CONFIG_EXTRA: "define('IKOEH_CONNECT_SETUP_KEY', 'local-dev-not-a-real-secret'); define('IKOEH_CONNECT_SKIP_HTTPS_CHECK', true); define('WP_ENVIRONMENT_TYPE', 'local');"
    volumes:
      - wp_data:/var/www/html
      - ./plugin:/var/www/html/wp-content/mu-plugins

  wp-cli:
    image: wordpress:cli
    depends_on:
      - wordpress
      - db
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      # Must match the `wordpress` service exactly: whichever container boots
      # first generates wp-config.php, and it is not regenerated afterward.
      WORDPRESS_CONFIG_EXTRA: "define('IKOEH_CONNECT_SETUP_KEY', 'local-dev-not-a-real-secret'); define('IKOEH_CONNECT_SKIP_HTTPS_CHECK', true); define('WP_ENVIRONMENT_TYPE', 'local');"
    volumes:
      - wp_data:/var/www/html

volumes:
  db_data:
  wp_data:
